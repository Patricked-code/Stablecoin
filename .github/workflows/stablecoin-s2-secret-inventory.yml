# =============================================================================
# Stablecoin — Inventaire des secrets S2 sans valeurs (canal de secours du MCP)
# Version : v1.0.0 — 2026-09-26 — DEC-2026-09-26-017
# Origine : adapté de Wealthtechinnovations/api_opcv
#           .github/workflows/governance-s2-secret-inventory.yml (@5ac4a313, non modifié).
# Dépôt public : le journal ne publie que des compteurs ; le rapport détaillé (noms et
# états, jamais de valeur) n'est publié que chiffré avec le secret S2_REPORT_PASSPHRASE.
# Journal des modifications
#   v1.0.0 (2026-09-26) : version initiale.
# =============================================================================
name: Stablecoin S2 Secret Inventory (secours MCP)

on:
  workflow_dispatch:
    inputs:
      mcp_unavailable_reason:
        description: "Obligatoire — preuve que le MCP est indisponible (erreur observée, date)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stablecoin-s2-ssh-fallback
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify governance consistency
        run: node scripts/verify-governance-consistency.js

      - name: Record fallback justification
        env:
          REASON: ${{ inputs.mcp_unavailable_reason }}
        run: |
          set -euo pipefail
          test -n "$REASON"
          echo "FALLBACK_CHANNEL=GITHUB_ACTIONS_SSH"
          echo "MCP_UNAVAILABLE_REASON=$REASON"

      - name: Prepare strict pinned SSH
        env:
          S2_HOST: ${{ secrets.S2_HOST || secrets.STABLECOIN_SSH_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY || secrets.STABLECOIN_SSH_PRIVATE_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS || secrets.STABLECOIN_SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/s2/prepare_s2_ssh.sh

      - name: Inventory runtime secret loading without values
        env:
          HOST: ${{ secrets.S2_HOST || secrets.STABLECOIN_SSH_HOST }}
          USER_SSH: ${{ secrets.S2_USER || secrets.STABLECOIN_SSH_USER }}
          S2_SSH_PORT: ${{ vars.S2_SSH_PORT || vars.STABLECOIN_SSH_PORT }}
        run: |
          set -euo pipefail
          umask 077
          SSH_USER="${USER_SSH:-root}"
          STABLECOIN_SSH_OPERATION_CLASS=READ_ONLY \
            bash .github/scripts/s2/s2_ssh_readonly_retry.sh \
            "$SSH_USER@$HOST" 'python3 -' .github/scripts/s2/s2_secret_inventory.py \
            > "$RUNNER_TEMP/S2_SECRET_INVENTORY.json"

      - name: Validate non-disclosure contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "S2_SECRET_INVENTORY.json")
          raw = open(path, encoding="utf-8").read()
          p = json.loads(raw)
          assert p["repository"] == "Patricked-code/Stablecoin"
          s = p["safety"]
          assert s["read_only"] is True
          assert s["values_exposed"] is False
          assert s["hashes_of_secret_values_exposed"] is False
          assert s["lengths_or_prefixes_exposed"] is False
          assert s["files_modified"] is False
          assert s["services_restarted"] is False
          # Défense en profondeur : aucune longue chaîne hexadécimale (clé, empreinte) dans le rapport.
          assert not re.search(r"[0-9a-fA-F]{32,}", raw), "long hexadecimal string found in report"
          print("STABLECOIN_S2_SECRET_INVENTORY_CONTRACT=PASS")
          PY

      - name: Publish public-safe summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          print("## Stablecoin — inventaire des secrets S2 (sans valeurs)")
          pth = pathlib.Path(os.environ["RUNNER_TEMP"]) / "S2_SECRET_INVENTORY.json"
          if not pth.exists() or pth.stat().st_size == 0:
              print("Inventaire indisponible : voir les journaux du job.")
          else:
              p = json.loads(pth.read_text(encoding="utf-8"))
              print(f"- fichiers .env* frontend : {len(p['frontend']['env_files'])}")
              print(f"- fichiers .env* backend : {len(p['backend']['env_files'])}")
              print("- détail (noms et états, jamais de valeur) : artefact chiffré uniquement (dépôt public).")
          PY

      - name: Encrypt detailed report
        id: encrypt
        env:
          PASSPHRASE: ${{ secrets.S2_REPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/S2_SECRET_INVENTORY.json"
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::notice::S2_REPORT_PASSPHRASE absent : rapport détaillé non publié (dépôt public)."
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o stablecoin-s2-secret-inventory.json.gpg "$src"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted report
        if: steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-s2-secret-inventory-encrypted
          path: stablecoin-s2-secret-inventory.json.gpg
          if-no-files-found: error
          retention-days: 7

      - name: Remove plaintext report and SSH material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/S2_SECRET_INVENTORY.json" 2>/dev/null || rm -f "$RUNNER_TEMP/S2_SECRET_INVENTORY.json"
          rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts

name: Governance Consistency

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  governance-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify governance consistency
        run: node scripts/verify-governance-consistency.js

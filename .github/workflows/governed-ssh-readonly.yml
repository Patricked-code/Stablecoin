# Governed SSH Readonly — canal de SECOURS (DEC-2026-09-26-016, DEC-2026-09-26-017)
# v1.2.0 (2026-09-26) : alignement AfricaFunds (DEC-2026-09-26-017) — secrets S2_HOST /
#   S2_SSH_KEY / S2_KNOWN_HOSTS / S2_USER (noms STABLECOIN_SSH_* conservés comme alias),
#   préparation SSH épinglée partagée (.github/scripts/s2/prepare_s2_ssh.sh), script
#   déplacé sous .github/scripts/s2/, connexion root admise explicitement, groupe de
#   concurrence commun à tout le canal S2.
# v1.1.0 (2026-09-26) : restauré depuis 44874fa comme fallback read-only,
#   utilisable uniquement quand le MCP wealthtech_ssh_bridge est indisponible ;
#   ajout du motif obligatoire mcp_unavailable_reason.
# v1.0.0 (2026-09-15) : version initiale (retirée par 36bf94f, DEC-2026-09-15-013).
name: Governed SSH Readonly

on:
  workflow_dispatch:
    inputs:
      mcp_unavailable_reason:
        description: Obligatoire — preuve que le MCP est indisponible (message d'erreur observé, date)
        required: true
        type: string
      action:
        description: Allowlisted read-only SSH action
        required: true
        type: choice
        options:
          - inventory
          - git_state
          - runtime_processes
          - full_readonly
        default: full_readonly
      target_path:
        description: Optional target path; leave blank to use the documented frontend path from .mcp/server-map.json
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stablecoin-s2-ssh-fallback
  cancel-in-progress: false

jobs:
  governed-ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify governance consistency
        run: node scripts/verify-governance-consistency.js

      - name: Record fallback justification
        shell: bash
        env:
          REASON: ${{ inputs.mcp_unavailable_reason }}
        run: |
          set -euo pipefail
          test -n "$REASON"
          echo "FALLBACK_CHANNEL=GITHUB_ACTIONS_SSH_READONLY"
          echo "MCP_UNAVAILABLE_REASON=$REASON"

      - name: Resolve governed target
        id: target
        shell: bash
        env:
          INPUT_TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TARGET_PATH" ]; then
            TARGET_PATH="$INPUT_TARGET_PATH"
          else
            TARGET_PATH="$(node -e 'const x=require("./.mcp/server-map.json"); process.stdout.write(x.runtime.frontend.documentedPath || "")')"
          fi
          if [ -z "$TARGET_PATH" ]; then
            echo "No target path available" >&2
            exit 1
          fi
          printf 'target_path=%s\n' "$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare strict pinned SSH
        shell: bash
        env:
          S2_HOST: ${{ secrets.S2_HOST || secrets.STABLECOIN_SSH_HOST }}
          S2_SSH_KEY: ${{ secrets.S2_SSH_KEY || secrets.STABLECOIN_SSH_PRIVATE_KEY }}
          S2_KNOWN_HOSTS: ${{ secrets.S2_KNOWN_HOSTS || secrets.STABLECOIN_SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/s2/prepare_s2_ssh.sh

      - name: Execute allowlisted read-only SSH action
        shell: bash
        env:
          SSH_HOST: ${{ secrets.S2_HOST || secrets.STABLECOIN_SSH_HOST }}
          SSH_USER: ${{ secrets.S2_USER || secrets.STABLECOIN_SSH_USER }}
          SSH_PORT: ${{ vars.S2_SSH_PORT || vars.STABLECOIN_SSH_PORT }}
          ACTION: ${{ inputs.action }}
          TARGET_PATH: ${{ steps.target.outputs.target_path }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          SSH_USER="${SSH_USER:-root}"
          PORT="${SSH_PORT:-22}"

          printf -v Q_ACTION '%q' "$ACTION"
          printf -v Q_TARGET '%q' "$TARGET_PATH"
          printf -v Q_REPO '%q' "Patricked-code/Stablecoin"
          printf -v Q_ROOT_POLICY '%q' "allow_root_shared_s2_key"

          ssh \
            -p "$PORT" \
            -i "$HOME/.ssh/id_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- $Q_ACTION $Q_TARGET $Q_REPO $Q_ROOT_POLICY" \
            < .github/scripts/s2/governed-readonly.sh

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
